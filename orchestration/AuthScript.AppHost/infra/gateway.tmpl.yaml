api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      additionalPortMappings:
        - targetPort: 8001
          external: false
      external: false
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: authscript-password
        value: '{{ .Env.AZURE_POSTGRES_PASSWORD }}'
      - name: athena--clientid
        value: '{{ .Env.AZURE_ATHENA_CLIENT_ID }}'
      - name: athena--clientsecret
        value: '{{ .Env.AZURE_ATHENA_CLIENT_SECRET }}'
      - name: connectionstrings--authscript
        value: Host=postgres;Port=5432;Username=postgres;Password={{ .Env.AZURE_POSTGRES_PASSWORD }};Database=authscript
      - name: connectionstrings--redis
        value: redis:6379,password={{ .Env.AZURE_REDIS_PASSWORD }}
      - name: redis-password
        value: '{{ .Env.AZURE_REDIS_PASSWORD }}'
  template:
    containers:
      - image: {{ .Image }}
        name: gateway
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: AUTHSCRIPT_DATABASENAME
            value: authscript
          - name: AUTHSCRIPT_HOST
            value: postgres
          - name: AUTHSCRIPT_JDBCCONNECTIONSTRING
            value: jdbc:postgresql://postgres:5432/authscript
          - name: AUTHSCRIPT_PORT
            value: "5432"
          - name: AUTHSCRIPT_URI
            value: postgresql://postgres:{{ uriEncode (.Env.AZURE_POSTGRES_PASSWORD )}}@postgres:5432/authscript
          - name: AUTHSCRIPT_USERNAME
            value: postgres
          - name: Athena__FhirBaseUrl
            value: https://api.preview.platform.athenahealth.com/fhir/r4/
          - name: Athena__PracticeId
            value: '{{ .Env.AZURE_ATHENA_PRACTICE_ID }}'
          - name: Athena__TokenEndpoint
            value: https://api.preview.platform.athenahealth.com/oauth2/v1/token
          - name: Demo__EnableCaching
            value: "true"
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }};8001'
          - name: Intelligence__BaseUrl
            value: http://intelligence.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES
            value: "true"
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES
            value: "true"
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: REDIS_HOST
            value: redis
          - name: REDIS_PORT
            value: "6379"
          - name: REDIS_URI
            value: redis://:{{ uriEncode (.Env.AZURE_REDIS_PASSWORD )}}@redis:6379
          - name: AUTHSCRIPT_PASSWORD
            secretRef: authscript-password
          - name: Athena__ClientId
            secretRef: athena--clientid
          - name: Athena__ClientSecret
            secretRef: athena--clientsecret
          - name: ConnectionStrings__authscript
            secretRef: connectionstrings--authscript
          - name: ConnectionStrings__redis
            secretRef: connectionstrings--redis
          - name: REDIS_PASSWORD
            secretRef: redis-password
    scale:
      minReplicas: 1
tags:
  azd-service-name: gateway
  aspire-resource-name: gateway
